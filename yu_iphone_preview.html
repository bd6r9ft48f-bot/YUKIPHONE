<div class="widget">
<small>今日のひとこと</small>
<h2>おつかれさま ☁️</h2>
<small>今日もいい一日になりますように</small>
</div>

<div class="apps">
<button class="app" onclick="openApp('messages')"><span class="icon green">💬</span><span>メッセージ</span></button>
<button class="app" onclick="openApp('photos')"><span class="icon pink">🌈</span><span>写真</span></button>
<button class="app" onclick="openApp('notes')"><span class="icon yellow">📝</span><span>メモ</span></button>
<button class="app" onclick="openApp('camera')"><span class="icon">📷</span><span>カメラ</span></button>
<button class="app" onclick="openApp('calendar')"><span class="icon">20</span><span>カレンダー</span></button>
<button class="app" onclick="openApp('music')"><span class="icon pink">♫</span><span>ミュージック</span></button>
<button class="app" onclick="openApp('settings')"><span class="icon">⚙️</span><span>設定</span></button>
<button class="app" onclick="openApp('safari')"><span class="icon blue">🧭</span><span>Safari</span></button>
</div>

<div class="dock">
<button class="app" onclick="openApp('messages')"><span class="icon green">💬</span><span>メッセージ</span></button>
<button class="app" onclick="openApp('photos')"><span class="icon pink">🌈</span><span>写真</span></button>
<button class="app" onclick="openApp('music')"><span class="icon pink">♫</span><span>音楽</span></button>
<button class="app" onclick="openApp('camera')"><span class="icon">📷</span><span>カメラ</span></button>
</div>
</section>

<section id="appview">
<div class="apphead">
<button onclick="backHome()">‹ ホーム</button>
<span id="appTitle">アプリ</span>
<span></span>
</div>
<div class="content" id="content"></div>
</section>

<div class="homebar" onclick="homeAction()"></div>
</div>

<script>
const lock = document.getElementById('lock');
const pass = document.getElementById('pass');
const home = document.getElementById('home');
const appview = document.getElementById('appview');

let code = '';

const now = new Date();
const days = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];

document.getElementById('date').textContent =
  `${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;

function updateTime(){
  const d = new Date();
  const time = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = time;
  document.getElementById('statusTime').textContent = time;
}
updateTime();
setInterval(updateTime,30000);

function show(screen){
  lock.style.display = 'none';
  pass.style.display = 'none';
  home.style.display = 'none';
  appview.style.display = 'none';
  screen.style.display = 'block';
}

function startPass(){
  code = '';
  updateDots();
  show(pass);
}

lock.addEventListener('click', e => {
  if(!e.target.closest('button')) startPass();
});

let startY = 0;
lock.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
}, {passive:true});

lock.addEventListener('touchend', e => {
  if(startY - e.changedTouches[0].clientY > 35) startPass();
}, {passive:true});

function updateDots(){
  document.querySelectorAll('.dot').forEach((dot,i)=>{
    dot.classList.toggle('on',i<code.length);
  });
}

document.querySelectorAll('[data-n]').forEach(button=>{
  button.addEventListener('click',()=>{
    if(code.length >= 4) return;
    code += button.dataset.n;
    updateDots();

    if(code.length === 4){
      if(code === '1224'){
        setTimeout(()=>show(home),200);
      }else{
        setTimeout(()=>{
          code = '';
          updateDots();
        },450);
      }
    }
  });
});

document.getElementById('cancel').onclick = () => show(lock);

document.getElementById('del').onclick = () => {
  code = code.slice(0,-1);
  updateDots();
};

function homeAction(){
  if(appview.style.display === 'block'){
    show(home);
  }else if(home.style.display === 'block'){
    show(lock);
  }else if(pass.style.display === 'block'){
    show(lock);
  }else{
    startPass();
  }
}

function backHome(){
  show(home);
}

function openApp(id){
  const content = document.getElementById('content');
  const title = document.getElementById('appTitle');

  const names = {
    messages:'メッセージ',
    photos:'写真',
    notes:'メモ',
    camera:'カメラ',
    calendar:'カレンダー',
    music:'ミュージック',
    settings:'設定',
    safari:'Safari'
  };

  title.textContent = names[id] || 'アプリ';
  content.innerHTML = '';

  if(id === 'messages'){
    content.innerHTML = `
      <div class="row" onclick="openChat()">
        <div class="avatar">🌷</div>
        <div><b>YUI</b><small>今日もおつかれさま〜！</small></div>
      </div>
      <div class="row">
        <div class="avatar">🐈</div>
        <div><b>家族</b><small>帰り気をつけてね！</small></div>
      </div>
      <div class="row">
        <div class="avatar">🎀</div>
        <div><b>おともだち</b><small>写真送って〜！</small></div>
      </div>`;
  }

  if(id === 'photos'){
    content.innerHTML = `
      <p style="color:#777">最近の項目</p>
      <div class="photos">
        ${['🌷','☁️','🍰','🪞','🌙','🎀','🐈','🧸','🌼','📸','🩷','✨']
          .map(x=>`<div class="photo">${x}</div>`).join('')}
      </div>`;
  }

  if(id === 'notes'){
    content.innerHTML = `
      <div class="notes"><b>今日やること 📝</b><br>
      □ お仕事がんばる<br>□ 写真を整理する<br>□ おいしいものを食べる</div>
      <div class="notes"><b>買いたいもの 🎀</b><br>
      リップ / ヘアクリップ / かわいいポーチ</div>
      <div class="notes"><b>忘れないこと</b><br>
      自分のペースでがんばる！</div>`;
  }

  if(id === 'camera'){
    content.innerHTML = `
      <div style="height:55vh;background:#222;border-radius:20px;
      display:grid;place-items:center;color:white;font-size:15px">
      カメラ 📷<br>デモ画面
      </div>`;
  }

  if(id === 'calendar'){
    content.innerHTML = `
      <div style="text-align:center;padding:25px">
      <p>10月</p><div style="font-size:70px">20</div>火曜日
      </div><div class="notes"><b>今日の予定</b><br>予定はありません ☁️</div>`;
  }

  if(id === 'music'){
    content.innerHTML = `
      <div style="text-align:center;padding:35px 0">
      <div style="font-size:100px">♫</div>
      <h2>お気に入り</h2><p>よく聴く曲</p>
      <button onclick="this.textContent=this.textContent==='▶ 再生'?'Ⅱ 一時停止':'▶ 再生'">▶ 再生</button>
      </div>`;
  }

  if(id === 'settings'){
    content.innerHTML = `
      <div class="row">✈️　機内モード　　オフ</div>
      <div class="row">📶　Wi-Fi　　接続済み</div>
      <div class="row">🔋　バッテリー　　82%</div>
      <div class="row">🔒　パスコード　　設定済み</div>`;
  }

  if(id === 'safari'){
    content.innerHTML = `
      <div class="notes" style="background:#eee;color:#555">🔍 検索またはWebサイト名を入力</div>
      <h3>お気に入り</h3>
      <div class="row">🌐　検索</div>
      <div class="row">☁️　天気予報</div>
      <div class="row">📷　写真プリント</div>`;
  }

  show(appview);
}

function openChat(){
  const content = document.getElementById('content');
  document.getElementById('appTitle').textContent = 'YUI';

  content.innerHTML = `
    <button onclick="openApp('messages')"
    style="border:0;background:none;color:#1685ff">‹ 一覧に戻る</button>
    <p style="text-align:center;color:#888;font-size:12px">今日 14:22</p>
    <div class="bubble">ゆうき〜！今日もおつかれさま 🫶🏻</div>
    <div class="bubble mine">ありがとう〜！そっちもおつかれ！</div>
    <div class="bubble">またあとで連絡するね 🌷</div>
    <div class="bubble mine">はーい！待ってるね 💗</div>`;
}
</script>
</body>
</html>
