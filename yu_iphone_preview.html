<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>YUKIPHONE</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #171719;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  color: white;
}

.phone {
  position: relative;
  width: min(100vw, 390px);
  height: min(100dvh, 844px);
  min-height: 600px;
  overflow: hidden;
  background: #273e66;
  isolation: isolate;
}

/* 壁紙 */
.wallpaper {
  position: absolute;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 20% 20%, #f5c9db 0%, transparent 40%),
    radial-gradient(ellipse at 85% 35%, #8da8d9 0%, transparent 40%),
    radial-gradient(ellipse at 45% 70%, #637db4 0%, transparent 48%),
    linear-gradient(160deg, #e8c9e2, #a7b9e3 45%, #354d80);
}

.wallpaper::before {
  content: "";
  position: absolute;
  width: 125%;
  height: 55%;
  left: -12%;
  top: 30%;
  border-radius: 50%;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,.58),
    rgba(255,255,255,.03) 60%,
    rgba(20,36,91,.25)
  );
  filter: blur(25px);
  transform: rotate(-25deg);
}

.wallpaper::after {
  content: "";
  position: absolute;
  width: 120%;
  height: 45%;
  right: -30%;
  bottom: 8%;
  border-radius: 50%;
  background: linear-gradient(135deg, #d8c9eeaa, #667db4aa);
  filter: blur(35px);
  transform: rotate(25deg);
}

/* ステータスバー */
.status {
  position: absolute;
  top: 15px;
  left: 27px;
  right: 27px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 600;
  z-index: 5;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

.battery {
  width: 23px;
  height: 11px;
  border: 1.4px solid white;
  border-radius: 3px;
  padding: 1.5px;
  position: relative;
}

.battery::before {
  content: "";
  display: block;
  height: 100%;
  width: 80%;
  background: white;
  border-radius: 1px;
}

.battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: white;
  border-radius: 0 2px 2px 0;
}

/* Dynamic Island風 */
.island {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 118px;
  height: 34px;
  background: #000;
  border-radius: 22px;
  z-index: 4;
}

/* 時計 */
.lock-content {
  position: absolute;
  top: 15%;
  left: 0;
  width: 100%;
  text-align: center;
}

.lock-icon {
  font-size: 16px;
  height: 25px;
  opacity: .95;
}

.date {
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -.4px;
  text-shadow: 0 1px 12px #27304b33;
}

.clock {
  font-size: clamp(82px, 25vw, 106px);
  font-weight: 300;
  letter-spacing: -5px;
  line-height: 1.08;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 20px #26345320;
}

/* 通知 */
.notifications {
  position: absolute;
  top: 43%;
  left: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.notification {
  min-height: 75px;
  padding: 12px 14px;
  border-radius: 22px;
  background: rgba(245, 245, 250, .72);
  border: 1px solid rgba(255,255,255,.36);
  color: #19191c;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: 0 4px 20px #17234410;
  display: flex;
  align-items: center;
  gap: 11px;
}

.app-icon {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 10px;
  background: linear-gradient(145deg, #79d7a2, #20a96b);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
}

.notice-body {
  flex: 1;
  min-width: 0;
}

.notice-heading {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
}

.notice-time {
  font-weight: 400;
  color: #65656a;
  white-space: nowrap;
}

.notice-text {
  margin-top: 4px;
  font-size: 14px;
  line-height: 1.3;
}

/* 下部ボタン */
.bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 125px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 10px 37px 0;
}

.round-button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(35, 38, 49, .48);
  border: 1px solid rgba(255,255,255,.18);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 22px;
  color: white;
  cursor: pointer;
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

.round-button:active {
  background: rgba(255,255,255,.35);
}

.flash-label {
  position: absolute;
  bottom: 88px;
  left: 37px;
  font-size: 10px;
  opacity: 0;
  transition: opacity .2s;
}

.flash-label.show {
  opacity: .9;
}

.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 135px;
  height: 5px;
  border-radius: 5px;
  background: white;
}

/* ロック画面から開いた後 */
.home-screen {
  position: absolute;
  inset: 0;
  display: none;
  padding: 65px 22px 35px;
  background: linear-gradient(155deg, #c9b5e7, #f2c9df 45%, #9db7e8);
  z-index: 10;
}

.home-screen.open {
  display: block;
}

.home-date {
  text-align: center;
  font-size: 15px;
  margin-bottom: 25px;
  text-shadow: 0 1px 8px #3332;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px 12px;
}

.app {
  text-align: center;
  font-size: 11px;
  text-shadow: 0 1px 5px #3334;
}

.app-square {
  width: 54px;
  height: 54px;
  margin: 0 auto 6px;
  border-radius: 14px;
  background: rgba(255,255,255,.85);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
  box-shadow: 0 4px 12px #3332;
}

.dock {
  position: absolute;
  bottom: 25px;
  left: 15px;
  right: 15px;
  padding: 12px 8px;
  border-radius: 27px;
  background: rgba(255,255,255,.3);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  backdrop-filter: blur(20px);
}

.dock .app-square {
  width: 52px;
  height: 52px;
  margin: auto;
}

.back-button {
  position: absolute;
  top: 25px;
  left: 20px;
  border: 0;
  background: #ffffff55;
  color: white;
  border-radius: 20px;
  padding: 8px 13px;
  font-size: 14px;
}

@media (min-width: 500px) {
  .phone {
    border: 7px solid #111;
    border-radius: 45px;
    height: min(844px, 94dvh);
  }

  .island {
    top: 12px;
  }

  .status {
    top: 17px;
  }
}
</style>
</head>

<body>

<div class="phone">
  <div class="wallpaper"></div>

  <div class="status">
    <span id="statusTime">9:41</span>
    <div class="status-icons">
      <svg width="18" height="14" viewBox="0 0 18 14">
        <path d="M1 5 Q9 -2 17 5 L15 7 Q9 1 3 7 Z" fill="white"/>
        <path d="M4 8 Q9 3 14 8 L12 10 Q9 7 6 10 Z" fill="white"/>
        <circle cx="9" cy="12" r="1.5" fill="white"/>
      </svg>
      <svg width="19" height="14" viewBox="0 0 19 14">
        <rect x="0" y="9" width="3" height="5" rx="1" fill="white"/>
        <rect x="4" y="6" width="3" height="8" rx="1" fill="white"/>
        <rect x="8" y="3" width="3" height="11" rx="1" fill="white"/>
        <rect x="12" y="0" width="3" height="14" rx="1" fill="white"/>
      </svg>
      <div class="battery"></div>
    </div>
  </div>

  <div class="island"></div>

  <div class="lock-content">
    <div class="lock-icon">🔒</div>
    <div class="date" id="date">10月20日 火曜日</div>
    <div class="clock" id="clock">9:41</div>
  </div>

  <div class="notifications">
    <div class="notification">
      <div class="app-icon">💬</div>
      <div class="notice-body">
        <div class="notice-heading">
          <span>メッセージ</span>
          <span class="notice-time">たった今</span>
        </div>
        <div class="notice-text">今日なにしてる？ 🎀</div>
      </div>
    </div>

    <div class="notification">
      <div class="app-icon" style="background:linear-gradient(145deg,#ff9bb7,#f34e79)">♡</div>
      <div class="notice-body">
        <div class="notice-heading">
          <span>YUKIPHONE</span>
          <span class="notice-time">1分前</span>
        </div>
        <div class="notice-text">今日も素敵な一日になりますように ✨</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <button class="round-button" id="flash" aria-label="懐中電灯">🔦</button>
    <button class="round-button" id="camera" aria-label="カメラ">📷</button>
    <div class="flash-label" id="flashLabel">懐中電灯 ON</div>
  </div>

  <div class="home-bar" id="homeBar"></div>

  <div class="home-screen" id="homeScreen">
    <button class="back-button" id="back">‹ ロック画面</button>
    <div class="home-date" id="homeDate"></div>

    <div class="app-grid">
      <div class="app"><div class="app-square">📅</div>カレンダー</div>
      <div class="app"><div class="app-square">📷</div>写真</div>
      <div class="app"><div class="app-square">🕰️</div>時計</div>
      <div class="app"><div class="app-square">🌤️</div>天気</div>
      <div class="app"><div class="app-square">📝</div>メモ</div>
      <div class="app"><div class="app-square">⚙️</div>設定</div>
      <div class="app"><div class="app-square">🎵</div>音楽</div>
      <div class="app"><div class="app-square">🗺️</div>マップ</div>
    </div>

    <div class="dock">
      <div class="app-square">📞</div>
      <div class="app-square">💬</div>
      <div class="app-square">🌐</div>
      <div class="app-square">🎵</div>
    </div>
  </div>
</div>

<script>
const clock = document.getElementById("clock");
const statusTime = document.getElementById("statusTime");
const date = document.getElementById("date");
const homeDate = document.getElementById("homeDate");

function updateTime() {
  const now = new Date();

  const time = now.toLocaleTimeString("ja-JP", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  clock.textContent = time;
  statusTime.textContent = time;

  date.textContent = now.toLocaleDateString("ja-JP", {
    month: "long",
    day: "numeric",
    weekday: "long"
  });

  homeDate.textContent = now.toLocaleDateString("ja-JP", {
    month: "long",
    day: "numeric",
    weekday: "long"
  });
}

updateTime();
setInterval(updateTime, 1000);
